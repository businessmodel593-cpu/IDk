<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Come & Eat — Authentic Igbo & Nigerian Cuisine">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come & Eat</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body { background:#fff; color:#222; scroll-behavior:smooth; }
a { text-decoration:none; color:inherit; }
header { position:sticky; top:0; background:#000; color:#fff; z-index:1000; border-bottom:2px solid #b3141a; }
nav { display:flex; justify-content:space-between; align-items:center; padding:1rem; position:relative; }
.logo { font-family:'Playfair Display', serif; font-size:1.4rem; color:#b3141a; }
.hamburger { font-size:1.8rem; cursor:pointer; }
.nav-links { display:none; flex-direction:column; background:#000; position:absolute; top:60px; right:0; min-width:220px; border:1px solid #b3141a; border-top:none; }
.nav-links.show { display:flex; }
.nav-links a { padding:1rem; border-top:1px solid rgba(255,255,255,0.1); }
.nav-links a:hover { background:#b3141a; }
.nav-links .signin-link { color:#b3141a; font-weight:600; }
.hero { height:100vh; background:linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1600&q=80") center/cover no-repeat; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; padding:1rem; }
.hero h1 { font-family:'Playfair Display', serif; font-size:2.5rem; margin-bottom:0.5rem; }
.hero p { font-size:1.1rem; margin-bottom:1.5rem; }
.btn { padding:0.8rem 1.5rem; background:#b3141a; color:#fff; border-radius:30px; font-weight:500; display:inline-block; }
footer { background:#000; color:#fff; text-align:center; padding:1.5rem; border-top:2px solid #b3141a; }
.socials a { margin:0 10px; color:#b3141a; }
</style>
</head>
<body>
<header>
<nav>
<div class="logo">Come & Eat</div>
<div class="hamburger" onclick="toggleMenu()">☰</div>
<div class="nav-links" id="navLinks">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="menu.html">Menu</a>
<a href="gallery.html">Gallery</a>
<a href="hours.html">Hours</a>
<a href="location.html">Location</a>
<a href="owner.html">Owner</a>
<a href="signin.html" class="signin-link">Sign In / Sign Up</a>
</div>
</nav>
</header>
<section class="hero">
<div>
<h1>Come and Eat Fast Here</h1>
<p>Taste the heart of Anambra</p>
<a class="btn" href="menu.html">View Menu</a>
</div>
</section>
<footer>
<p>&copy; 2026 Come & Eat</p>
<div class="socials">
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">Twitter</a>
</div>
</footer>
<script>
function toggleMenu() {
 document.getElementById("navLinks").classList.toggle("show");
}
</script>
</body>
</html>
